name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: What happened?, description: And what did you expect?}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Steps to reproduce}
  - type: input
    id: versions
    attributes: {label: Versions, placeholder: "Cliché 0.1.0, macOS 15.3, M2"}
    validations: {required: true}
