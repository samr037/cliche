name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-26
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tests
        run: CLICHE_BUILD="$RUNNER_TEMP/build" scripts/test.sh

      - name: Build Cliché.app
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0-${GITHUB_SHA::7}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          CLICHE_SIGN=- CLICHE_BUILD="$RUNNER_TEMP/build" CLICHE_APP="$PWD/dist/Cliché.app" CLICHE_VERSION="$VERSION" scripts/build-app.sh

      - name: DMG
        run: |
          scripts/make-dmg.sh "dist/Cliché.app" "dist/Cliche-$VERSION.dmg"
          (cd dist && shasum -a 256 "Cliche-$VERSION.dmg") | tee "dist/Cliche-$VERSION.dmg.sha256"

      # Provenance signée (Sigstore) : gh attestation verify Cliche-x.y.z.dmg -R samr037/cliche
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: dist/Cliche-*.dmg

      - name: Bundle d'attestation
        run: cp "${{ steps.attest.outputs.bundle-path }}" "dist/Cliche-$VERSION.dmg.sigstore.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Cliche-${{ env.VERSION }}
          path: dist/Cliche-*.dmg*

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          **Install:** open the DMG, drag Cliché to Applications. First launch: System Settings › Privacy & Security › *Open Anyway* (the app is not notarized). Then allow *Screen Recording*.

          **Verify** that this DMG was built by this repository's CI: \`gh attestation verify Cliche-$VERSION.dmg -R ${GITHUB_REPOSITORY}\`
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/Cliche-$VERSION.dmg dist/Cliche-$VERSION.dmg.sha256 dist/Cliche-$VERSION.dmg.sigstore.json \
            --title "Cliché $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
