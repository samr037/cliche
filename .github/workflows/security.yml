name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Analyse statique du code Swift. Dépôt privé sans GitHub Advanced Security : le SARIF n'est pas
  # téléversé, le job échoue s'il contient une alerte. Dépôt public : alertes dans l'onglet Security.
  codeql:
    runs-on: macos-26
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: swift
          build-mode: manual
          queries: security-extended
      - name: Build
        run: swift build --scratch-path "$RUNNER_TEMP/build"
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          output: sarif
      - name: Alertes CodeQL
        run: |
          n=$(jq '[.runs[].results[]] | length' sarif/*.sarif)
          echo "CodeQL : $n alerte(s)"
          jq -r '.runs[].results[] | "\(.ruleId)  \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)  \(.message.text)"' sarif/*.sarif
          [ "$n" -eq 0 ]

  # Secrets commités (clés, jetons) sur tout l'historique.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks 8.30.1 (somme de contrôle vérifiée)
        run: |
          curl -fsSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
          ./gitleaks git --redact --no-banner -v .

  # Bonnes pratiques de la chaîne d'approvisionnement (actions épinglées, permissions, branches…).
  # Dépôt public seulement : sur un dépôt privé, Scorecard exige un jeton personnel (GraphQL).
  scorecard:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ !github.event.repository.private && github.event_name != 'pull_request' }}
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: ${{ !github.event.repository.private }}
        with:
          sarif_file: results.sarif
      - name: Score
        run: jq -r '.runs[0].tool.driver.name, (.runs[0].results | length | tostring) + " recommandation(s)"' results.sarif
