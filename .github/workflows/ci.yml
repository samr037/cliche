name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Traductions (mêmes clés et paramètres dans les 8 langues)
        run: python3 scripts/l10n.py check
      - name: Tests (ClicheCore)
        run: CLICHE_BUILD="$RUNNER_TEMP/build" scripts/test.sh
      - name: Build app (release, ad hoc)
        run: CLICHE_SIGN=- CLICHE_BUILD="$RUNNER_TEMP/build" CLICHE_APP="$RUNNER_TEMP/Cliché.app" scripts/build-app.sh
