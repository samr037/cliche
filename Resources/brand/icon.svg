<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a59"/>
      <stop offset=".55" stop-color="#f0436b"/>
      <stop offset="1" stop-color="#b8237a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#5a0b33" flood-opacity=".35"/>
    </filter>
  </defs>
  <!-- Gabarit macOS : carré arrondi de 824 px centré, marge 100 px -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="4"/>
  <!-- Viseur : quatre coins de sélection -->
  <g fill="none" stroke="#ffffff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" filter="url(#drop)">
    <path d="M262 400 V302 Q262 262 302 262 H400"/>
    <path d="M624 262 H722 Q762 262 762 302 V400"/>
    <path d="M762 624 V722 Q762 762 722 762 H624"/>
    <path d="M400 762 H302 Q262 762 262 722 V624"/>
  </g>
  <!-- Annotation : flèche effilée jaune qui pointe vers le centre -->
  <g filter="url(#drop)">
    <path d="M374 655 L 498 507 L 460 471 L 604 420 L 563 566 L 525 531 L 386 666 Z" fill="#ffd84d" stroke="#ffd84d" stroke-width="10" stroke-linejoin="round"/>
  </g>
</svg>
